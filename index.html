<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sefer Sırası</title>
<link rel="icon" type="image/svg+xml" href="sofor-ikon.svg"><link rel="apple-touch-icon" href="sofor-ikon.png"><meta name="apple-mobile-web-app-title" content="Sefer Sırası"><meta name="theme-color" content="#0f8a57">
<link rel="manifest" href="manifest-sofor.json">
<style>
:root{--yesil:#1fa36a;--koyu:#0f8a57;--lac:#10202e;--mavi:#16507e;--sari:#ffcf33;--zemin:#eef2f5;--gri:#5b6b7a}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;margin:0;padding:0;overflow-x:hidden;background:var(--zemin);color:var(--lac);font-size:18px}
.ust{background:linear-gradient(135deg,#0f8a57 0%,#1fa36a 45%,#16507e 100%);color:#fff;padding:20px 16px 50px;position:relative;overflow:hidden;display:flex;gap:14px;align-items:center}
.ust::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-24px;height:48px;background:var(--zemin);border-radius:50% 50% 0 0}
.ust .ik{width:50px;height:50px;border-radius:15px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ust h1{margin:0;font-size:28px;font-weight:900;letter-spacing:-.5px;line-height:1}
.ust p{margin:5px 0 0;font-size:15px;font-weight:600;opacity:.92}
.ust .kod{margin-left:auto;align-self:flex-start;background:var(--sari);color:var(--lac);font-weight:900;font-size:15px;padding:6px 10px;border-radius:9px;letter-spacing:.5px}
.ic{padding:0 14px 24px;position:relative;z-index:1}
h2{font-size:24px;font-weight:900;margin:16px 2px 8px;letter-spacing:-.3px}
h3{font-size:18px;font-weight:800;margin:14px 0 6px}
.sekmeler{display:flex;gap:6px;margin-bottom:8px;background:#fff;padding:5px;border-radius:14px;box-shadow:0 2px 10px rgba(16,32,46,.07)}
.sekmeler button{flex:1;padding:12px 6px;font-family:inherit;font-size:16px;font-weight:700;border:0;border-radius:10px;background:transparent;color:#4d5d6b}
.sekmeler button.aktif{background:var(--yesil);color:#fff}
.gunler button.aktif{background:var(--lac)}
#bMim.aktif{background:#1e63b8}
#bMur.aktif{background:#d33b34}
label{display:block;margin-top:10px;color:#4d5d6b;font-weight:600;font-size:15px}
textarea,select,input[type=date],input[type=time],input[type=number],input:not([type]){font-family:inherit;color:var(--lac);background:#fff;border:1.5px solid #d5dde5;border-radius:10px}
textarea{width:100%;box-sizing:border-box;font-size:20px;padding:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--yesil);box-shadow:0 0 0 3px rgba(31,163,106,.18)}
.arac{display:flex;gap:8px;align-items:center;margin:6px 0}
.arac span{width:64px;font-weight:800;font-size:20px}
.arac select{flex:1;font-size:18px;padding:10px}
.arac input{width:28px;height:28px}
input[type=checkbox]{accent-color:var(--yesil)}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:8px;font-size:17px;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #edf0f3}
th{background:var(--lac);color:#fff;text-align:left;font-weight:700}
th,td{padding:10px 8px;border-bottom:1px solid #edf0f3}
tr.uyari td{background:#fdecea}
tr.bos td{background:#fff6d6}
button.ana{padding:16px;font-family:inherit;font-size:19px;font-weight:800;background:var(--yesil);color:#fff;border:0;border-radius:12px;width:100%;margin:12px 0;box-shadow:0 2px 6px rgba(16,32,46,.12)}
button:disabled,textarea:disabled,select:disabled,input:disabled{opacity:.55}
.kucuk{color:var(--gri);font-size:15px}
details.bolum{background:#fff;border:0;border-radius:18px;margin:12px 0;padding:0 14px;box-shadow:0 2px 10px rgba(16,32,46,.07)}
details.bolum>summary{font-size:20px;font-weight:900;padding:16px 2px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px}
details.bolum>summary::-webkit-details-marker{display:none}
details.bolum>summary::before{content:'›';display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border-radius:50%;background:#eaf6f0;color:var(--koyu);font-size:24px;font-weight:900;transition:transform .15s}
details.bolum[open]>summary::before{transform:rotate(90deg)}
details.bolum[open]{padding-bottom:12px}
#sayac:not(:empty){background:var(--lac);color:#fff;border-radius:16px;padding:8px 12px;margin-top:8px}
#sayac .kucuk{color:#b8c4cf}
label[style*="#e8edf3"]{color:var(--lac)!important}
label[style*="#ffcf5a"]{color:#b7791f!important}
[style*="#2c3a4b"]{border-color:#edf0f3!important}
#bulut{color:var(--gri)}
button[style*="#8e44ad"]{background:var(--lac)!important}
/* tasarim */
/* tasarim */
</style>
</head>
<body>
<div class="ust"><div class="ik" style="background:none"><img src="sofor-ikon.svg" width="54" height="54" style="display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2))" onerror="this.parentNode.style.display='none'"></div><div><h1>Sefer Sırası</h1><p>Şoför paneli</p></div><div class="kod">BL-105</div></div>
<div class="ic">
<div class="sekmeler gunler">
<button id="g_hi" onclick="gunSec('hi')">Hafta içi</button>
<button id="g_cmt" onclick="gunSec('cmt')">Cumartesi</button>
<button id="g_paz" onclick="gunSec('paz')">Pazar</button>
</div>
<div class="sekmeler gunler">
<button id="m_yaz" onclick="mevsimSec('yaz')">Yaz – 8 nöbetçi</button>
<button id="m_kis" onclick="mevsimSec('kis')">Kış – 7 nöbetçi</button>
</div>
<div class="sekmeler">
<button id="bMim" class="aktif" onclick="sekme('mim')">Mimarsinan</button>
<button id="bMur" onclick="sekme('mur')">Muratçeşme</button>
</div>
<div style="margin:6px 0"><label>Tarih</label><input type="date" id="tarih" onchange="tarihSec(this.value)" style="font-size:18px;padding:8px;width:100%;box-sizing:border-box;border-radius:8px"></div>
<div class="sekmeler"><button onclick="veriKopyala()">Verileri kopyala</button><button onclick="veriYapistir()">Verileri yapıştır</button></div>
<div id="alan"></div>
<div id="bulut" class="kucuk" style="text-align:center;margin:10px 0"></div>
</div>
<div style="background:#10202e;color:#fff;text-align:center;padding:16px;font-size:13px;font-weight:600"><span style="opacity:.75">Seyithan Niksarlı tarafından geliştirildi</span> <b style="background:#ffcf33;color:#10202e;padding:3px 8px;border-radius:7px;margin-left:6px">BL-105</b></div>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="saat.js"></script>
<script src="sofor.js"></script>
<script src="izin.js"></script>
<script src="iett.js"></script>
<script src="trafik.js"></script>
<script src="ogren.js"></script>
<script>try{if('serviceWorker' in navigator){window.addEventListener('load',function(){try{navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}})}}catch(e){}</script>
</body>
</html>
