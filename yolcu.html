function bugun(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function simdiSn(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds()}
function saat(x){x=Math.round(x);return String(Math.floor(x/3600)%24).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')}
function mesafe(a,b){const R=6371e3,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

if(q.has('qr')){qrSayfa()}else{baslat()}

function baslat(){
 const s=document.getElementById('durak');
 let o='<option value="">Durağını seç</option>';for(const b of ['mim','mur']){const g=[];HAT[b].forEach(x=>{if(!g.includes(x[0]))g.push(x[0])});o+='<optgroup label="'+HATAD[b]+'">'+g.map(n=>'<option value="'+n+'"'+(n==secili?' selected':'')+'>'+n+'</option>').join('')+'</optgroup>'}s.innerHTML=o;
 try{
  firebase.initializeApp(FBC);const db=firebase.firestore();
  db.collection('plan').doc(bugun()).onSnapshot(d=>{const x=d.data()||{};PLAN={mim:x.mim?JSON.parse(x.mim):[],mur:x.mur?JSON.parse(x.mur):[]};planVar=!!(x.mim||x.mur);ciz()},()=>hata());
  db.collection('ayar').doc('duraklar').onSnapshot(d=>{const x=d.data();if(x&&x.v){try{KONUM=JSON.parse(x.v)}catch(e){}}haritaCiz()},()=>{});
  db.collection('canli').onSnapshot(sn=>{CANLI={};sn.forEach(d=>{CANLI[d.id]=d.data()});ciz()},()=>{});
 }catch(e){hata()}
 setInterval(ciz,10000);
}
function hata(){document.getElementById('liste').innerHTML='<p class="bilgi">Bağlanılamadı. İnternet bağlantını kontrol et.</p>'}
function durakSec(v){secili=v;try{history.replaceState(null,'','?durak='+encodeURIComponent(v))}catch(e){}ciz();haritaCiz()}
function konumBul(){
 if(!navigator.geolocation){alert('Telefonun konum vermiyor');return}
 navigator.geolocation.getCurrentPosition(p=>{
  const ben=[p.coords.latitude,p.coords.longitude];let en=null,em=1e12;
  for(const n of DURAKLAR){const p=KONUM[kk(n)];if(!p)continue;const m=mesafe(ben,p);if(m<em){em=m;en=n}}
  if(!en){alert('Durak konumları henüz yüklenmedi');return}
  document.getElementById('durak').value=en;durakSec(en);
  if(em>1500)alert('En yakın durak '+en+', yaklaşık '+(em/1000).toFixed(1)+' km uzakta.');
 },()=>alert('Konum izni verilmedi. Durağı listeden seçebilirsin.'),{enableHighAccuracy:true,timeout:15000});
}
function canliBilgi(plk,dep){
 const c=CANLI[plk];if(!c||Date.now()-c.z>120000||c.dep!==dep)return null;return c;
}
function varis(hat,s,D,n){
 const A=[[0,0]];for(const [ad,dk] of D){const N=ANK[hat][ad];if(N!==undefined)A.push([N,dk])}
 A.sort((a,b)=>a[0]-b[0]);let p=A[0],q=null;
 for(const a of A){if(a[0]<=n)p=a;else{q=a;break}}
 const dk=q?p[1]+(n-p[0])/(q[0]-p[0])*(q[1]-p[1]):p[1]+(n-p[0]);
 return s+dk*60;
}
function gelenler(hat,yon){
 const n=simdiSn(),L=[],E=HAT[hat].filter(x=>x[0]==secili&&x[2]==yon);if(!E.length)return [];
 for(const [s,p,D] of PLAN[hat]||[]){
  for(const e of E){
   let t=varis(hat,s,D,e[1]);const c=canliBilgi(p,s);
   if(c&&c.gec!=null&&e[1]>0)t+=Math.max(-60,c.gec);
   if(t<n-30)continue;
   L.push({t:t,p:p,c:!!c,yolda:n>=s});
  }
 }
 return L.sort((a,b)=>a.t-b.t).slice(0,3);
}
function ciz(){
 const el=document.getElementById('liste');if(!el)return;
 if(!secili){el.innerHTML='<p class="bilgi">Bulunduğun durağı seç ya da "En yakın durağı bul" tuşuna bas.</p>';return}
 if(!planVar){el.innerHTML='<p class="bilgi">Bugünün sefer listesi henüz girilmedi.</p>';return}
 const n=simdiSn();let h='',var_=false;
 for(const hat of ['mim','mur'])for(const yon of ['g','d']){
  const L=gelenler(hat,yon);if(!L.length)continue;var_=true;
  h+='<div class="kart"><div class="hat '+hat+'">● '+HATAD[hat]+' · '+YON[hat][yon]+'</div>';
  for(const x of L){const k=Math.max(0,Math.round((x.t-n)/60));
   h+='<div class="sat"><div><span class="plk">'+x.p+'</span>'+(x.c?'<span class="canli">CANLI</span>':'')+'<div class="kucuk">'+(x.yolda?'Yolda':'Henüz kalkmadı')+' · '+saat(x.t)+'</div></div><div class="dk'+(k<=3?' yakin':'')+'">'+(k==0?'Geliyor':k+' dk')+'</div></div>'}
  h+='</div>';
 }
 el.innerHTML=var_?h:'<p class="bilgi">Bu durağa bugün başka minibüs gelmiyor.</p>';
 haritaCanli();
}
function haritaCiz(){
 const el=document.getElementById('harita');if(!el||!window.L)return;
 if(!HAR){HAR=L.map(el).setView([41.02,28.59],13);const k1=L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abc',attribution:'© OpenStreetMap'}),k2=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});k1.addTo(HAR);let hs=0;k1.on('tileerror',()=>{if(++hs==3){HAR.removeLayer(k1);k2.addTo(HAR)}});L.control.layers({'Harita':k1,'Harita 2':k2}).addTo(HAR)}
 if(secili&&KONUM[kk(secili)])HAR.setView(KONUM[kk(secili)],15);
 haritaCanli();
}
function haritaCanli(){
 if(!HAR)return;IM.forEach(m=>m.remove());IM=[];
 if(secili&&KONUM[kk(secili)])IM.push(L.circleMarker(KONUM[kk(secili)],{radius:10,color:'#2f6fd6',fillOpacity:.8}).addTo(HAR).bindTooltip(secili,{permanent:true,direction:'top'}));
 for(const p in CANLI){const c=CANLI[p];if(Date.now()-c.z>120000||c.lat==null)continue;
  IM.push(L.marker([c.lat,c.lng],{icon:L.divIcon({html:'<div style="background:#e74c3c;color:#fff;font-weight:bold;border-radius:10px;padding:3px 7px;font-size:14px;white-space:nowrap">🚐 '+p+'</div>',className:'',iconAnchor:[30,12]})}).addTo(HAR))}
}
function qrSayfa(){
 const KOD='BL-105';
 const st=document.createElement('style');st.textContent=`
 body.qrmod{background:#e9edf1;padding:0}
 .arac{position:sticky;top:0;z-index:5;background:#14202b;color:#fff;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 .arac select,.arac button{width:auto;font-size:16px;padding:10px 14px;margin:0;border-radius:10px}
 .arac span{font-size:14px;opacity:.8}
 #qrlar{display:flex;flex-direction:column;align-items:center;gap:20px;padding:20px 0}
 .afis{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;box-sizing:border-box;display:flex;flex-direction:column;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#10202e;-webkit-print-color-adjust:exact;print-color-adjust:exact;box-shadow:0 4px 18px rgba(0,0,0,.15)}
 .ust{background:linear-gradient(135deg,#0f8a57 0%,#1fa36a 45%,#16507e 100%);color:#fff;padding:12mm 14mm 22mm;position:relative}
 .ust::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-14mm;height:28mm;background:#fff;border-radius:50% 50% 0 0}

 .ust h1{font-size:16mm;line-height:1;margin:0;font-weight:900;letter-spacing:-.5mm;text-align:left}
 .ust p{font-size:7.5mm;margin:4mm 0 0;opacity:.95;font-weight:600}
 .durak{margin:-4mm 14mm 0;position:relative;z-index:2}
 .durak small{display:block;font-size:4.5mm;letter-spacing:1.2mm;color:#1fa36a;font-weight:800}
 .durak b{display:block;font-size:11mm;line-height:1.05;font-weight:900;margin-top:1.5mm}
 .hatlar{display:flex;gap:3mm;flex-wrap:wrap;margin-top:4mm}
 .hatlar i{font-style:normal;font-size:4.6mm;font-weight:800;padding:2mm 4.5mm;border-radius:20mm;background:#e6effb;color:#1e63b8}
 .hatlar i.mur{background:#fdeceb;color:#d33b34}
 .orta{flex:1;min-height:0;display:flex;align-items:center;gap:9mm;padding:8mm 14mm 4mm}
 .qrk{background:#fff;border:2.2mm solid #10202e;border-radius:9mm;padding:6mm;flex-shrink:0;position:relative}
 .qrk::before{content:"OKUT";position:absolute;top:-6.5mm;left:50%;transform:translateX(-50%);background:#ffcf33;color:#10202e;font-weight:900;font-size:5mm;letter-spacing:1mm;padding:1.5mm 5mm;border-radius:10mm}
 .qrk img,.qrk canvas{width:72mm!important;height:72mm!important;display:block}
 .adim{display:flex;flex-direction:column;gap:6mm}
 .adim>div{display:flex;gap:4mm;align-items:flex-start}
 .adim em{font-style:normal;flex-shrink:0;width:11mm;height:11mm;border-radius:50%;background:#1fa36a;color:#fff;font-weight:900;font-size:6mm;display:flex;align-items:center;justify-content:center}
 .adim strong{display:block;font-size:6mm;line-height:1.15}
 .adim span{display:block;font-size:4.3mm;color:#4d5d6b;margin-top:1mm;line-height:1.3}
 .bant{margin:0 14mm 6mm;background:#f2f5f8;border-radius:6mm;padding:5mm 6mm;display:flex;gap:6mm;justify-content:space-around;text-align:center}
 .bant div{font-size:4.2mm;color:#4d5d6b;font-weight:600}
 .bant div b{display:block;font-size:6.5mm;color:#10202e;margin-bottom:1mm}
 .alt{background:#10202e;color:#fff;padding:7mm 14mm;display:flex;align-items:center;justify-content:space-between}
 .alt .not{font-size:7mm;font-weight:800;line-height:1.1;letter-spacing:.3mm}
 .alt .kod{font-size:15mm;font-weight:900;letter-spacing:1mm;background:#ffcf33;color:#10202e;padding:1mm 7mm;border-radius:4mm}
 @media screen and (max-width:900px){.afis{zoom:.45}}
 @page{size:A4 portrait;margin:0}
 @media print{body.qrmod{background:#fff}.arac{display:none}#qrlar{display:block;padding:0}.afis{box-shadow:none;page-break-after:always;break-after:page;zoom:1}}`;
 document.head.appendChild(st);document.body.className='qrmod';
 document.getElementById('ana').outerHTML='<div class="arac"><select id="qhat" onchange="qrCiz()"><option value="hepsi">Tüm duraklar</option><option value="mim">Mimarsinan durakları</option><option value="mur">Muratçeşme durakları</option></select><select id="qtek" onchange="qrCiz()"></select><button onclick="print()">🖨 Yazdır</button><span id="qsay"></span></div><div id="qrlar"></div>';
 const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
 s.onload=()=>{window.QR_KOD=KOD;qrCiz()};document.head.appendChild(s);
}
function qrCiz(){
 const h=document.getElementById('qhat').value,t=document.getElementById('qtek');
 let L=h=='hepsi'?DURAKLAR.slice():[];if(h!='hepsi')HAT[h].forEach(x=>{if(!L.includes(x[0]))L.push(x[0])});
 const once=t.value;t.innerHTML='<option value="">Hepsini göster</option>'+L.map(n=>'<option'+(n==once?' selected':'')+'>'+n+'</option>').join('');
 if(t.value)L=[t.value];
 document.getElementById('qsay').textContent=L.length+' afiş';
 const k=document.getElementById('qrlar'),u=location.origin+location.pathname;k.innerHTML='';
 const minibus='<svg viewBox="0 0 64 64" width="64" height="64" fill="none"><rect x="6" y="14" width="50" height="30" rx="7" fill="#fff"/><rect x="12" y="19" width="12" height="10" rx="2" fill="#1fa36a"/><rect x="27" y="19" width="12" height="10" rx="2" fill="#1fa36a"/><rect x="42" y="19" width="9" height="10" rx="2" fill="#1fa36a"/><circle cx="18" cy="46" r="6" fill="#10202e" stroke="#fff" stroke-width="3"/><circle cx="44" cy="46" r="6" fill="#10202e" stroke="#fff" stroke-width="3"/><path d="M56 30h3v8h-3" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>';
 for(const n of L){
  const hat=['mim','mur'].filter(b=>HAT[b].some(x=>x[0]==n));
  const d=document.createElement('div');d.className='afis';
  d.innerHTML='<div class="ust"><div class="ik">'+minibus+'</div><h1>Minibüs nerede?</h1><p>Kaç dakikada geleceğini telefonundan gör.</p></div>'+
  '<div class="durak"><small>BULUNDUĞUNUZ DURAK</small><b>'+n+'</b><div class="hatlar">'+hat.map(b=>'<i class="'+b+'">● '+(b=='mim'?'Mimarsinan':'Muratçeşme')+'</i>').join('')+'</div></div>'+
  '<div class="orta"><div class="qrk"><div class="q"></div></div><div class="adim">'+
  '<div><em>1</em><div><strong>Kamerayı aç</strong><span>Telefonunun kamerasını bu koda tut.</span></div></div>'+
  '<div><em>2</em><div><strong>Bağlantıya dokun</strong><span>Durağın kendiliğinden açılır.</span></div></div>'+
  '<div><em>3</em><div><strong>Bekleme süresini gör</strong><span>Gelen minibüs, plakası ve kaç dakika kaldığı ekranda.</span></div></div>'+
  '</div></div>'+
  '<div class="bant"><div><b>Ücretsiz</b>Uygulama indirmeye gerek yok</div><div><b>Canlı</b>Minibüsü haritada izle</div><div><b>Her iki yön</b>Tüm seferler tek ekranda</div></div>'+
  '<div class="alt"><div class="not">Durak<br>kodu</div><div class="kod">'+(window.QR_KOD||'BL-105')+'</div></div>';
  k.appendChild(d);
  new QRCode(d.querySelector('.q'),{text:u+'?durak='+encodeURIComponent(n),width:600,height:600,correctLevel:QRCode.CorrectLevel.H});
 }
}
</script>
