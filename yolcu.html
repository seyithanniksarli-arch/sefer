<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minibüs Nerede?</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{font-family:-apple-system,Helvetica,Arial,sans-serif;margin:0;padding:14px;background:#f4f6f8;color:#14202b;font-size:18px}
h1{font-size:26px;margin:4px 0 12px;text-align:center}
select,button{font-size:20px;padding:14px;border-radius:12px;width:100%;box-sizing:border-box}
select{border:1px solid #c5cfd8;background:#fff}
button{border:0;background:#1fa36a;color:#fff;font-weight:bold;margin-top:8px}
.kart{background:#fff;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.hat{font-size:15px;color:#5b6b7a;font-weight:bold;margin-bottom:6px}
.sat{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #edf0f3}
.sat:first-of-type{border-top:0}
.dk{font-size:34px;font-weight:bold;color:#1fa36a;min-width:110px;text-align:right}
.dk.yakin{color:#e67e22}
.plk{font-size:22px;font-weight:bold}
.kucuk{font-size:14px;color:#5b6b7a}
.canli{display:inline-block;background:#e74c3c;color:#fff;font-size:12px;padding:2px 8px;border-radius:10px;margin-left:6px;vertical-align:middle}
#harita{height:260px;border-radius:14px;margin-top:12px}
.bilgi{text-align:center;color:#5b6b7a;font-size:15px;margin:10px 0}
.qr{display:inline-block;width:46%;margin:2%;text-align:center;page-break-inside:avoid;border:2px dashed #999;padding:10px;box-sizing:border-box}
.qr h2{font-size:22px;margin:6px 0}
@media print{button{display:none}}
</style>
</head>
<body>
<div id="ana">
<h1>🚐 Minibüs Nerede?</h1>
<select id="durak" onchange="durakSec(this.value)"></select>
<button onclick="konumBul()">📍 En yakın durağı bul</button>
<div id="liste"><p class="bilgi">Yükleniyor...</p></div>
<div id="harita"></div>
<p class="bilgi">Süreler sefer planına göre hesaplanır. <span class="canli">CANLI</span> yazanlarda minibüsün gerçek konumu kullanılır.</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const ANK={mim:{'Doğan Gıda':4,'Makro Çarşı':7,'Denizgören':12,'Moroğlu':16,'Balıkçı':18,'Metrobüs':30,'TÜYAP':35,'Çekmece':43,'Mimar Sinan':49,'Meydan':55,'Makro':60,'Atrium':65},mur:{'Göbek':3,'Kiptaş':5,'Akbelde':8,'Metrobüs':27,'TÜYAP':32,'Çekmece':40,'Hastane':45}};
const KK={'Fatih Market':'Fatih Market','Atrium Çarşı':'Atrium','Anaokulu (Doğan Gıda)':'Doğan Gıda','Makro Çarşı':'Makro Çarşı','Mustafa Kemal Paşa Bulvarı (Meydan)':'Meydan','Denizgören':'Denizgören','Siteler (Moroğlu)':'Moroğlu','Mimar Sinan Belediye (Balıkçı)':'Balıkçı','Metrobüs':'Metrobüs','TÜYAP':'TÜYAP','Çekmece':'Çekmece','Balıkçılar (Mimar Sinan)':'Mimar Sinan','Muratçeşme':'Muratçeşme','Göbek (Pınar Sokak)':'Göbek','Mimar Sinan Kiptaş':'Kiptaş','Akbelde':'Akbelde','Mimar Sinan Devlet Hastanesi':'Hastane'};
const YON={mim:{g:'TÜYAP yönü',d:'Atrium yönü'},mur:{g:'Metrobüs yönü',d:'Muratçeşme yönü'}};
const HAT={mim:[['Fatih Market',0,'g'],['Güzelce Yol Ağzı',0.5,'g'],['Billur Caddesi',1,'g'],['Çarmıklı Caddesi',1.5,'g'],['Atrium Çarşı',2.5,'g'],['Anaokulu (Doğan Gıda)',4,'g'],['Villalar',4.5,'g'],['Sahil Tepe Villaları',5,'g'],['Sinanoba',6,'g'],['Makro Çarşı',7,'g'],['Mimar Sinan Konakları',8,'g'],['Mimaroba Muhtarlık',8.5,'g'],['Oba',9.5,'g'],['Dr. Sadık Ahmet İlkokulu',10.5,'g'],['Mustafa Kemal Paşa Bulvarı (Meydan)',12,'g'],['Denizgören',13,'g'],['Piri Reis Caddesi',14.5,'g'],['Siteler (Moroğlu)',16,'g'],['İnönü Caddesi',16,'g'],['Güzelsu',17,'g'],['Doç. Dr. Burhan Bahriyeli Lisesi',17.5,'g'],['Mimar Sinan Belediye (Balıkçı)',18,'g'],['Eczane',20,'g'],['Büyükçekmece Atirus',21,'g'],['Büyükçekmece İŞKUR',22,'g'],['Fatih Mahallesi',23,'g'],['Tabya 1',25,'g'],['Tabya 2',27,'g'],['Metrobüs',30,'g'],
 ['TÜYAP',35,'d'],['Doğa Koleji',37,'d'],['Çekmece',43,'d'],['Eczane',45,'d'],['Mimar Sinan Karayolları',47,'d'],['Mimar Sinan Camii',48.5,'d'],['Balıkçılar (Mimar Sinan)',49,'d'],['Doç. Dr. Burhan Bahriyeli Lisesi',50.5,'d'],['Güzelsu',51.5,'d'],['İnönü Caddesi',52.5,'d'],['Siteler (Moroğlu)',53,'d'],['Piri Reis Caddesi',53.5,'d'],['Denizgören',55,'d'],['Mustafa Kemal Paşa Bulvarı (Meydan)',56,'d'],['Dr. Sadık Ahmet İlkokulu',57,'d'],['Oba',57.5,'d'],['Mimaroba Muhtarlık',58.5,'d'],['Mimar Sinan Konakları',59,'d'],['Makro Çarşı',60,'d'],['Sinanoba',61,'d'],['Sahil Tepe Villaları',62,'d'],['Villalar',62.5,'d'],['Anaokulu (Doğan Gıda)',63.5,'d'],['Atrium Çarşı',65,'d'],['Çarmıklı Caddesi',66,'d'],['Billur Caddesi',67,'d'],['Güzelce Yol Ağzı',68.5,'d']],
mur:[['Muratçeşme',0,'g'],['Muratçeşme Sağlık Ocağı',1.5,'g'],['Hünkartepe Caddesi',2.5,'g'],['Göbek (Pınar Sokak)',3,'g'],['Yunus Emre Caddesi',4,'g'],['Mimar Sinan Kiptaş',5,'g'],['Dizdariye Caddesi',6.5,'g'],['Pir Sultan Sokak',7,'g'],['Akkent',7.5,'g'],['Akbelde',8,'g'],['Mimar Sinan Devlet Hastanesi',10,'g'],['Mimar Sinan Belediye (Balıkçı)',14,'g'],['Eczane',16,'g'],['Büyükçekmece Atirus',17,'g'],['Büyükçekmece İŞKUR',18,'g'],['Fatih Mahallesi',19,'g'],['Tabya 1',20.5,'g'],['Tabya 2',22.5,'g'],['Metrobüs',25,'g'],
 ['TÜYAP',32,'d'],['Çekmece',40,'d'],['Eczane',42,'d'],['Akçimento',44,'d'],['Mimar Sinan Devlet Hastanesi',45,'d'],['Akbelde',47,'d'],['Akkent',47.5,'d'],['Pir Sultan Sokak',48,'d'],['Dizdariye Caddesi',48.5,'d'],['Mimar Sinan Kiptaş',50,'d'],['Yunus Emre Caddesi',51,'d'],['Göbek (Pınar Sokak)',52,'d'],['Hünkartepe Caddesi',52.5,'d'],['Muratçeşme Sağlık Ocağı',53.5,'d']]};
const DURAKLAR=[];for(const b of ['mim','mur'])for(const x of HAT[b])if(!DURAKLAR.includes(x[0]))DURAKLAR.push(x[0]);
const kk=n=>KK[n]||n;
const HATAD={mim:'Mimarsinan hattı',mur:'Muratçeşme hattı'};
const FBC={apiKey:"AIzaSyDMcP2Sd_6Y7OukKsowNTWxwJggs3oOn8w",authDomain:"sefer-ca13e.firebaseapp.com",projectId:"sefer-ca13e",storageBucket:"sefer-ca13e.firebasestorage.app",messagingSenderId:"706047335288",appId:"1:706047335288:web:e1f1c1d838db32cad9468d"};
const q=new URLSearchParams(location.search);
let PLAN={mim:[],mur:[]},KONUM={},CANLI={},secili=q.get('durak')||'',HAR=null,IM=[],planVar=false;
function bugun(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function simdiSn(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds()}
function saat(x){x=Math.round(x);return String(Math.floor(x/3600)%24).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')}
function mesafe(a,b){const R=6371e3,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

if(q.has('qr')){qrSayfa()}else{baslat()}

function baslat(){
 const s=document.getElementById('durak');
 let o='<option value="">Durağını seç</option>';for(const b of ['mim','mur']){const g=[];HAT[b].forEach(x=>{if(!g.includes(x[0]))g.push(x[0])});o+='<optgroup label="'+HATAD[b]+'">'+g.map(n=>'<option value="'+n+'"'+(n==secili?' selected':'')+'>'+n+'</option>').join('')+'</optgroup>'}s.innerHTML=o;
 try{
  firebase.initializeApp(FBC);const db=firebase.firestore();
  db.collection('plan').doc(bugun()).onSnapshot(d=>{const x=d.data()||{};PLAN={mim:x.mim?JSON.parse(x.mim):[],mur:x.mur?JSON.parse(x.mur):[]};planVar=!!(x.mim||x.mur);ciz()},()=>hata());
  db.collection('ayar').doc('duraklar').onSnapshot(d=>{const x=d.data();if(x&&x.v){try{KONUM=JSON.parse(x.v)}catch(e){}}haritaCiz()},()=>{});
  db.collection('canli').onSnapshot(sn=>{CANLI={};sn.forEach(d=>{CANLI[d.id]=d.data()});ciz()},()=>{});
 }catch(e){hata()}
 setInterval(ciz,10000);
}
function hata(){document.getElementById('liste').innerHTML='<p class="bilgi">Bağlanılamadı. İnternet bağlantını kontrol et.</p>'}
function durakSec(v){secili=v;try{history.replaceState(null,'','?durak='+encodeURIComponent(v))}catch(e){}ciz();haritaCiz()}
function konumBul(){
 if(!navigator.geolocation){alert('Telefonun konum vermiyor');return}
 navigator.geolocation.getCurrentPosition(p=>{
  const ben=[p.coords.latitude,p.coords.longitude];let en=null,em=1e12;
  for(const n of DURAKLAR){const p=KONUM[kk(n)];if(!p)continue;const m=mesafe(ben,p);if(m<em){em=m;en=n}}
  if(!en){alert('Durak konumları henüz yüklenmedi');return}
  document.getElementById('durak').value=en;durakSec(en);
  if(em>1500)alert('En yakın durak '+en+', yaklaşık '+(em/1000).toFixed(1)+' km uzakta.');
 },()=>alert('Konum izni verilmedi. Durağı listeden seçebilirsin.'),{enableHighAccuracy:true,timeout:15000});
}
function canliBilgi(plk,dep){
 const c=CANLI[plk];if(!c||Date.now()-c.z>120000||c.dep!==dep)return null;return c;
}
function varis(hat,s,D,n){
 const A=[[0,0]];for(const [ad,dk] of D){const N=ANK[hat][ad];if(N!==undefined)A.push([N,dk])}
 A.sort((a,b)=>a[0]-b[0]);let p=A[0],q=null;
 for(const a of A){if(a[0]<=n)p=a;else{q=a;break}}
 const dk=q?p[1]+(n-p[0])/(q[0]-p[0])*(q[1]-p[1]):p[1]+(n-p[0]);
 return s+dk*60;
}
function gelenler(hat,yon){
 const n=simdiSn(),L=[],E=HAT[hat].filter(x=>x[0]==secili&&x[2]==yon);if(!E.length)return [];
 for(const [s,p,D] of PLAN[hat]||[]){
  for(const e of E){
   let t=varis(hat,s,D,e[1]);const c=canliBilgi(p,s);
   if(c&&c.gec!=null&&e[1]>0)t+=Math.max(-60,c.gec);
   if(t<n-30)continue;
   L.push({t:t,p:p,c:!!c,yolda:n>=s});
  }
 }
 return L.sort((a,b)=>a.t-b.t).slice(0,3);
}
function ciz(){
 const el=document.getElementById('liste');if(!el)return;
 if(!secili){el.innerHTML='<p class="bilgi">Bulunduğun durağı seç ya da "En yakın durağı bul" tuşuna bas.</p>';return}
 if(!planVar){el.innerHTML='<p class="bilgi">Bugünün sefer listesi henüz girilmedi.</p>';return}
 const n=simdiSn();let h='',var_=false;
 for(const hat of ['mim','mur'])for(const yon of ['g','d']){
  const L=gelenler(hat,yon);if(!L.length)continue;var_=true;
  h+='<div class="kart"><div class="hat">'+HATAD[hat]+' · '+YON[hat][yon]+'</div>';
  for(const x of L){const k=Math.max(0,Math.round((x.t-n)/60));
   h+='<div class="sat"><div><span class="plk">'+x.p+'</span>'+(x.c?'<span class="canli">CANLI</span>':'')+'<div class="kucuk">'+(x.yolda?'Yolda':'Henüz kalkmadı')+' · '+saat(x.t)+'</div></div><div class="dk'+(k<=3?' yakin':'')+'">'+(k==0?'Geliyor':k+' dk')+'</div></div>'}
  h+='</div>';
 }
 el.innerHTML=var_?h:'<p class="bilgi">Bu durağa bugün başka minibüs gelmiyor.</p>';
 haritaCanli();
}
function haritaCiz(){
 const el=document.getElementById('harita');if(!el||!window.L)return;
 if(!HAR){HAR=L.map(el).setView([41.02,28.59],13);const k1=L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png',{maxZoom:19,subdomains:'abc',attribution:'© OpenStreetMap'}),k2=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'© Esri'});k1.addTo(HAR);let hs=0;k1.on('tileerror',()=>{if(++hs==3){HAR.removeLayer(k1);k2.addTo(HAR)}});L.control.layers({'Harita':k1,'Harita 2':k2}).addTo(HAR)}
 if(secili&&KONUM[kk(secili)])HAR.setView(KONUM[kk(secili)],15);
 haritaCanli();
}
function haritaCanli(){
 if(!HAR)return;IM.forEach(m=>m.remove());IM=[];
 if(secili&&KONUM[kk(secili)])IM.push(L.circleMarker(KONUM[kk(secili)],{radius:10,color:'#2f6fd6',fillOpacity:.8}).addTo(HAR).bindTooltip(secili,{permanent:true,direction:'top'}));
 for(const p in CANLI){const c=CANLI[p];if(Date.now()-c.z>120000||c.lat==null)continue;
  IM.push(L.marker([c.lat,c.lng],{icon:L.divIcon({html:'<div style="background:#e74c3c;color:#fff;font-weight:bold;border-radius:10px;padding:3px 7px;font-size:14px;white-space:nowrap">🚐 '+p+'</div>',className:'',iconAnchor:[30,12]})}).addTo(HAR))}
}
function qrSayfa(){
 document.getElementById('ana').innerHTML='<h1>Durak QR kodları</h1><button onclick="print()">Yazdır</button><div id="qrlar"></div>';
 const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
 s.onload=()=>{const k=document.getElementById('qrlar'),u=location.origin+location.pathname;
  DURAKLAR.forEach(n=>{const d=document.createElement('div');d.className='qr';d.innerHTML='<h2>'+n+'</h2><div></div><p>Minibüs kaç dakikada gelir?<br>Telefonunun kamerasıyla okut</p>';k.appendChild(d);new QRCode(d.querySelector('div'),{text:u+'?durak='+encodeURIComponent(n),width:200,height:200})});
  document.querySelectorAll('.qr img,.qr canvas').forEach(x=>x.style.margin='0 auto')};
 document.head.appendChild(s);
}
</script>
</body>
</html>
