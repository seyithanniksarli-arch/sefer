function bugun(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function simdiSn(){const n=new Date();return n.getHours()*3600+n.getMinutes()*60+n.getSeconds()}
function saat(x){x=Math.round(x);return String(Math.floor(x/3600)%24).padStart(2,'0')+':'+String(Math.floor(x%3600/60)).padStart(2,'0')}
function mesafe(a,b){const R=6371e3,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

 const s=document.getElementById('durak');

 try{

function konumBul(){
 if(!navigator.geolocation){alert('Telefonun konum vermiyor');return}
 navigator.geolocation.getCurrentPosition(p=>{
  const ben=[p.coords.latitude,p.coords.longitude];let en=null,em=1e12;
  for(const n of DURAKLAR){const p=KONUM[kk(n)];if(!p)continue;const m=mesafe(ben,p);if(m<em){em=m;en=n}}
  if(!en){alert('Durak konumları henüz yüklenmedi');return}
  document.getElementById('durak').value=en;durakSec(en);
  if(em>1500)alert('En yakın durak '+en+', yaklaşık '+(em/1000).toFixed(1)+' km uzakta.');
 },()=>alert('Konum izni verilmedi. Durağı listeden seçebilirsin.'),{enableHighAccuracy:true,timeout:15000});
}
function canliBilgi(plk,dep){
 const c=CANLI[plk];if(!c||Date.now()-c.z>120000||c.dep!==dep)return null;return c;
}
function varis(hat,s,D,n){
 const A=[[0,0]];for(const [ad,dk] of D){const N=ANK[hat][ad];if(N!==undefined)A.push([N,dk])}
 A.sort((a,b)=>a[0]-b[0]);let p=A[0],q=null;
 for(const a of A){if(a[0]<=n)p=a;else{q=a;break}}
 const dk=q?p[1]+(n-p[0])/(q[0]-p[0])*(q[1]-p[1]):p[1]+(n-p[0]);
 return s+dk*60;
}
function gelenler(hat,yon){
 const n=simdiSn(),L=[],E=HAT[hat].filter(x=>x[0]==secili&&x[2]==yon);if(!E.length)return [];
 for(const [s,p,D] of PLAN[hat]||[]){
  for(const e of E){
   let t=varis(hat,s,D,e[1]);const c=canliBilgi(p,s);
   if(c&&c.gec!=null&&e[1]>0)t+=Math.max(-60,c.gec);
   if(t<n-30)continue;
   L.push({t:t,p:p,c:!!c,yolda:n>=s});
  }
 }
 return L.sort((a,b)=>a.t-b.t).slice(0,3);
}
function ciz(){
 const el=document.getElementById('liste');if(!el)return;
 if(!secili){el.innerHTML='<p class="bilgi">Bulunduğun durağı seç ya da "En yakın durağı bul" tuşuna bas.</p>';return}
 if(!planVar){el.innerHTML='<p class="bilgi">Bugünün sefer listesi henüz girilmedi.</p>';return}
 const n=simdiSn();let h='',var_=false;
 for(const hat of ['mim','mur'])for(const yon of ['g','d']){
  const L=gelenler(hat,yon);if(!L.length)continue;var_=true;
  h+='<div class="kart"><div class="hat '+hat+'">● '+HATAD[hat]+' · '+YON[hat][yon]+'</div>';
  for(const x of L){const k=Math.max(0,Math.round((x.t-n)/60));
   h+='<div class="sat"><div><span class="plk">'+x.p+'</span>'+(x.c?'<span class="canli">CANLI</span>':'')+'<div class="kucuk">'+(x.yolda?'Yolda':'Henüz kalkmadı')+' · '+saat(x.t)+'</div></div><div class="dk'+(k<=3?' yakin':'')+'">'+(k==0?'Geliyor':k+' dk')+'</div></div>'}
  h+='</div>';
 }

 haritaCanli();
}

}

 document.head.appendChild(st);document.body.className='qrmod';
 document.getElementById('ana').outerHTML='<div class="arac"><select id="qhat" onchange="qrCiz()"><option value="hepsi">Tüm duraklar</option><option value="mim">Mimarsinan durakları</option><option value="mur">Muratçeşme durakları</option></select><select id="qtek" onchange="qrCiz()"></select><button onclick="print()">🖨 Yazdır</button><span id="qsay"></span></div><div id="qrlar"></div>';
 const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
 s.onload=()=>{window.QR_KOD=KOD;qrCiz()};document.head.appendChild(s);
}
function qrCiz(){
 const h=document.getElementById('qhat').value,t=document.getElementById('qtek');
 let L=h=='hepsi'?DURAKLAR.slice():[];if(h!='hepsi')HAT[h].forEach(x=>{if(!L.includes(x[0]))L.push(x[0])});
 const once=t.value;t.innerHTML='<option value="">Hepsini göster</option>'+L.map(n=>'<option'+(n==once?' selected':'')+'>'+n+'</option>').join('');
 if(t.value)L=[t.value];
 document.getElementById('qsay').textContent=L.length+' afiş';
 const k=document.getElementById('qrlar'),u=location.origin+location.pathname;k.innerHTML='';
 const minibus='<svg viewBox="0 0 64 64" width="64" height="64" fill="none"><rect x="6" y="14" width="50" height="30" rx="7" fill="#fff"/><rect x="12" y="19" width="12" height="10" rx="2" fill="#1fa36a"/><rect x="27" y="19" width="12" height="10" rx="2" fill="#1fa36a"/><rect x="42" y="19" width="9" height="10" rx="2" fill="#1fa36a"/><circle cx="18" cy="46" r="6" fill="#10202e" stroke="#fff" stroke-width="3"/><circle cx="44" cy="46" r="6" fill="#10202e" stroke="#fff" stroke-width="3"/><path d="M56 30h3v8h-3" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>';
 for(const n of L){
  const hat=['mim','mur'].filter(b=>HAT[b].some(x=>x[0]==n));
  const d=document.createElement('div');d.className='afis';
  d.innerHTML='<div class="ust"><div class="ik">'+minibus+'</div><h1>Minibüs nerede?</h1><p>Kaç dakikada geleceğini telefonundan gör.</p></div>'+
  '<div class="durak"><small>BULUNDUĞUNUZ DURAK</small><b>'+n+'</b><div class="hatlar">'+hat.map(b=>'<i class="'+b+'">● '+(b=='mim'?'Mimarsinan':'Muratçeşme')+'</i>').join('')+'</div></div>'+
  '<div class="orta"><div class="qrk"><div class="q"></div></div><div class="adim">'+
  '<div><em>1</em><div><strong>Kamerayı aç</strong><span>Telefonunun kamerasını bu koda tut.</span></div></div>'+
  '<div><em>2</em><div><strong>Bağlantıya dokun</strong><span>Durağın kendiliğinden açılır.</span></div></div>'+
  '<div><em>3</em><div><strong>Bekleme süresini gör</strong><span>Gelen minibüs, plakası ve kaç dakika kaldığı ekranda.</span></div></div>'+
  '</div></div>'+
  '<div class="bant"><div><b>Ücretsiz</b>Uygulama indirmeye gerek yok</div><div><b>Canlı</b>Minibüsü haritada izle</div><div><b>Her iki yön</b>Tüm seferler tek ekranda</div></div>'+
  '<div class="alt"><div class="not">Durak<br>kodu</div><div class="kod">'+(window.QR_KOD||'BL-105')+'</div></div>';
  k.appendChild(d);
  new QRCode(d.querySelector('.q'),{text:u+'?durak='+encodeURIComponent(n),width:600,height:600,correctLevel:QRCode.CorrectLevel.H});
 }
}
</script>
