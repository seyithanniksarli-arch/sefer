function gelenler(hat,yon){
 const n=simdiSn(),L=[],E=HAT[hat].filter(x=>x[0]==secili&&x[2]==yon);if(!E.length)return [];
 const M=yon=='g'?HAT[hat].find(x=>x[0]=='Metrobüs'&&x[2]=='g'):null;
 for(const [s,p,D] of PLAN[hat]||[]){
  for(const e of E){
   const K=sKum(hat,D);let t=varis(hat,s,K,e[1]);const c=canliBilgi(p,s);
   const gc=(c&&c.gec!=null&&e[1]>0)?Math.max(-60,c.gec):0;
   t+=gc;
   if(n>=(Math.floor(t/60)+1)*60)continue;
   let m=null;if(M&&M[1]>e[1])m=varis(hat,s,K,M[1])+gc;
   L.push({t:t,p:p,c:!!c,yolda:n>=s,m:m});
  }
 }
 return L.sort((a,b)=>a.t-b.t).slice(0,3);
}
function ciz(){
 const el=document.getElementById('liste');if(!el)return;
 if(!secili){el.innerHTML='<p class="bilgi">Bulunduğun durağı seç ya da "En yakın durağı bul" tuşuna bas.</p>';return}
 if(!planVar){el.innerHTML='<p class="bilgi">Bugünün sefer listesi henüz girilmedi.</p>';return}
 const n=simdiSn();let h='',var_=false,mt=null;
 for(const hat of ['mim','mur'])for(const yon of ['g','d']){
  const L=gelenler(hat,yon);if(!L.length)continue;var_=true;
  for(const x of L){const d=x.t-n,k=d>120?Math.ceil(d/60):0;
   if(x.m!=null&&(mt===null||x.t<mt.t))mt=x;
   h+='<div class="kart"><div class="k1"><span class="rz '+hat+'">'+HATK[hat]+' · '+YON[hat][yon]+'</span><span class="sa">'+(x.yolda?'Yolda':'Henüz kalkmadı')+' · '+saat(x.t)+'</span></div>'+
   '<div class="k2"><span class="pl"><span class="plk">'+x.p+'</span>'+(x.c?'<span class="canli">CANLI</span>':'')+'</span><div class="dk'+(k<=10?' yakin':'')+(d<=120?' durakta':'')+'">'+(d>120?'<b>'+k+'</b> <i>dk</i>':d>0?'Geliyor / Durakta':'Durakta')+'</div></div></div>'}
 }
 if(mt){const mk=Math.max(1,Math.ceil((mt.m-n)/60));h+='<div class="metro"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffcf33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16V6a2 2 0 012-2h10a2 2 0 012 2v10M5 16h14M5 16v2h3v-2M19 16v2h-3v-2M5 11h14"/></svg><span>Metrobüs\'e varış <em>'+mk+' dk</em></span></div>'}
