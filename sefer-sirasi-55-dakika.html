<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sefer Sırası</title>
<link rel="icon" type="image/svg+xml" href="sofor-ikon.svg"><link rel="apple-touch-icon" href="sofor-ikon.png"><meta name="apple-mobile-web-app-title" content="Sefer Sırası">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#14212D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest-sofor.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ===== Renk değişkenleri: açık tema (Temiz ve aydınlık) ===== */
:root{
 --zemin:#F4F7F9;--kart:#FFFFFF;--cizgi:#DDE5EB;--cizgi2:#E7EDF2;
 --yazi:#0E1B2A;--yazi2:#34465A;--yazi3:#4A5B6A;--pasif:#9AA9B6;--giris-kenar:#9AA9B6;
 --yesil:#0F7A4F;--yesil-yazi:#0F7A4F;
 --mavi:#1A5FB4;--mavi-yazi:#1A5FB4;--mavi-zemin:#E4EEFA;--tab-aktif:#1A5FB4;--nokta:#1A5FB4;--halka:#CFE0F5;
 --kirmizi:#B3261E;--mur:#C62F29;--mur-kenar:#C62F29;--mur-yazi:#B42620;
 --turuncu:#B35A00;--rozet:#FFCF33;--rozet-yazi:#10202E;
 --ok:#0F7A4F;--uy:#B35A00;--kt:#B3261E;
 --uyari-zemin:#FDECEA;--uyari-yazi:#8A1F17;--bos-zemin:#FFF6D6;
 --gol:rgba(14,27,42,.06);
 --tab-yuk:78px;--alt-boslugu:78px;
}
/* ===== Koyu tema: Aracım gece / Sıra gece ===== */
@media (prefers-color-scheme: dark){
:root{
 --zemin:#0B1620;--kart:#14212D;--cizgi:#26384A;--cizgi2:#203243;
 --yazi:#EAF1F7;--yazi2:#C3CFDA;--yazi3:#A9B8C6;--pasif:#6B7F91;--giris-kenar:#6B7F91;
 --yesil:#0F7A4F;--yesil-yazi:#4CC38A;
 --mavi:#1A5FB4;--mavi-yazi:#7DB1F2;--mavi-zemin:#1C3350;--tab-aktif:#8DBAF4;--nokta:#4D8FE0;--halka:#2B4F80;
 --kirmizi:#B3261E;--mur:#C62F29;--mur-kenar:#E0564E;--mur-yazi:#FF9A92;
 --turuncu:#F0A04B;--rozet:#DCE6F0;--rozet-yazi:#0E1B2A;
 --ok:#4CC38A;--uy:#F0A04B;--kt:#FF9A92;
 --uyari-zemin:#3B1F1D;--uyari-yazi:#FFB4AB;--bos-zemin:#33291A;
 --gol:rgba(0,0,0,.3);
}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light dark}
body{margin:0;padding:0;overflow-x:hidden;background:var(--zemin);color:var(--yazi);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:17px;line-height:1.35}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
/* ===== Üst başlık ===== */
.ust{background:var(--kart);padding:16px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--cizgi)}
.ust .ik{width:48px;height:48px;border-radius:14px;background:var(--yesil);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ust .ad{flex:1;min-width:0}
.ust h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.ust p{margin:3px 0 0;font-size:15px;font-weight:600;color:var(--yazi3)}
.rozet{background:var(--rozet);color:var(--rozet-yazi);font-weight:800;font-size:15px;padding:7px 11px;border-radius:9px;letter-spacing:.5px}
/* ===== Sekme alanları ===== */
.sek{display:none}
body[data-sekme=aracim] #sek_aracim,body[data-sekme=sira] #sek_sira,body[data-sekme=seferler] #sek_seferler,body[data-sekme=daha] #sek_daha{display:block}
.sar{max-width:600px;margin:0 auto;padding:16px 16px calc(var(--alt-boslugu) + 16px)}
h2{font-size:24px;font-weight:800;margin:0;letter-spacing:-.3px}
h3{font-size:18px;font-weight:800;margin:14px 0 6px}
.bas{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:2px 0 12px}
.bas span{font-size:14px;font-weight:600;color:var(--yazi3)}
.kucuk{color:var(--yazi3);font-size:14px;font-weight:600}
label{display:block;margin-top:10px;color:var(--yazi2);font-weight:700;font-size:15px}
.kutu{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;padding:14px}
.kutu+.kutu,.kutu+details,details+.kutu{margin-top:12px}
/* ===== Aracım: sabit plaka kartı ===== */
.plaka-sar{position:sticky;top:0;z-index:20;background:var(--zemin);padding:12px 16px 8px}
.plaka-kart{max-width:568px;margin:0 auto;background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;padding:12px 14px 10px}
.plaka-sat{display:flex;align-items:flex-end;gap:12px}
.plaka-sat .pl{width:112px;flex-shrink:0;display:flex;flex-direction:column;gap:4px}
.plaka-sat label{margin:0;font-size:14px;font-weight:700;color:var(--yazi2)}
#benim{width:100%;height:52px;border:2px solid var(--giris-kenar);border-radius:14px;background:var(--zemin);color:var(--yazi);font-family:inherit;font-size:22px;font-weight:800;padding:0 14px;outline:none}
#benim:focus{border-color:var(--mavi-yazi)}
.takip-dugme{flex:1;min-width:0;height:52px;border:0;border-radius:14px;background:var(--yesil);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 8px}
.takip-dugme.acik{background:var(--kirmizi)}
.durum{margin:8px 0 0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--yazi3)}
.durum i{width:10px;height:10px;border-radius:50%;background:var(--pasif);flex-shrink:0}
.durum.acik i{background:var(--yesil-yazi)}
.aracim-ic{display:flex;flex-direction:column;gap:12px;padding-top:8px}
/* ===== Aktif sefer kartı ===== */
.akt{background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;overflow:hidden}
.akt-bas{background:var(--mavi);color:#fff;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.akt-bas span:first-child{font-size:15px;font-weight:800;letter-spacing:.6px}
.akt-bas span:last-child{font-size:17px;font-weight:800}
.akt-gov{padding:16px 20px 20px;text-align:center}
.akt-sure{font-size:clamp(56px,24.6vw,96px);line-height:1;font-weight:800;letter-spacing:-3px;font-variant-numeric:tabular-nums;color:var(--yazi)}
.akt-sure.neg{font-size:clamp(48px,19vw,80px)}
.akt-sure.kirmizi{color:var(--kt)}
.akt-ad{margin-top:6px;font-size:30px;font-weight:800;color:var(--yesil-yazi);line-height:1.15}
.akt-plan{margin:8px 0 0;font-size:18px;font-weight:600;color:var(--yazi2)}
.ekler{display:flex;flex-direction:column;gap:8px}
.ekler:empty{display:none}
.sat{min-height:56px;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;display:flex;align-items:center;gap:12px;padding:6px 16px}
.sat svg{flex-shrink:0}
.sat .sat-ad{flex:1;min-width:0;font-size:16px;font-weight:600;color:var(--yazi2)}
.sat b{font-size:20px;font-weight:800;text-align:right}
.sat.sat-ok b{color:var(--ok)}.sat.sat-uy b{color:var(--uy)}.sat.sat-kt b{color:var(--kt)}
.sat.sat-448 .sat-ad{font-size:17px;font-weight:700;color:var(--yazi)}
.sat.sat-448 b{font-size:17px}
.sat-not,.ekler p.kucuk{margin:0;text-align:center;font-size:13px;font-weight:600;color:var(--yazi3)}
.saat-not{margin:4px 0 0;text-align:center;font-size:14px;font-weight:600;color:var(--yazi3)}
.dur-bas{display:flex;align-items:baseline;justify-content:space-between;margin:6px 0 12px}
.dur-bas span{font-size:14px;font-weight:600;color:var(--yazi3)}
.dur-kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;overflow:hidden}
.dur-sat{min-height:54px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--cizgi2)}
.dur-sat:last-child{border-bottom:0}
.dur-sat .dn{flex:1;min-width:0;font-size:18px;font-weight:700}
.dur-sat .dz{font-size:16px;font-weight:600;color:var(--yazi2);font-variant-numeric:tabular-nums}
.dur-sat .dd{min-width:52px;text-align:right;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.dur-sat .ik-bitti{flex-shrink:0}
.dur-sat .ik-simdi{width:22px;height:22px;border-radius:50%;background:var(--nokta);border:5px solid var(--halka);flex-shrink:0}
.dur-sat .ik-sonra{width:22px;height:22px;border-radius:50%;border:2px solid var(--pasif);flex-shrink:0}
.dur-sat svg{flex-shrink:0}
.uyari-kutu{background:var(--uyari-zemin);color:var(--uyari-yazi);border-radius:14px;padding:14px 16px;font-size:18px;font-weight:700;line-height:1.35}
#sayac:empty::before{content:"Takibi başlatınca aktif sefer, geri sayım ve duraklar burada görünür.";display:block;background:var(--kart);border:1px dashed var(--cizgi);border-radius:16px;padding:18px 16px;text-align:center;font-size:16px;font-weight:600;color:var(--yazi3)}
#sayac{display:flex;flex-direction:column;gap:12px}
.imza{margin:12px 0 0;text-align:center;font-size:14px;font-weight:600;color:var(--yazi3)}
/* ===== Sabit alt düğmeler (yalnız Aracım) ===== */
#aksiyon{display:none;position:fixed;left:0;right:0;bottom:var(--tab-yuk);z-index:40;background:var(--kart);border-top:1px solid var(--cizgi);padding:10px 16px}
body[data-sekme=aracim] #aksiyon{display:block}
#aksiyon .ic{max-width:568px;margin:0 auto;display:flex;gap:10px}
#aksiyon button{flex:1;min-height:60px;border:0;border-radius:16px;color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 6px}
#aksiyon .cik{background:var(--kirmizi)}
#aksiyon .gir{background:var(--yesil)}
/* ===== Alt sekme çubuğu ===== */
#alt{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--kart);border-top:1px solid var(--cizgi);padding:6px 8px max(14px,env(safe-area-inset-bottom,0px))}
#alt .ic{max-width:600px;margin:0 auto;display:flex;gap:4px}
#alt button{flex:1;min-width:0;min-height:58px;border:0;border-radius:14px;background:transparent;color:var(--yazi3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13px;font-weight:700;padding:0}
#alt button[aria-current=page]{background:var(--mavi-zemin);color:var(--tab-aktif);font-weight:800}
/* ===== Sıra sekmesi ===== */
.hat-sek{display:flex;gap:10px}
.hat-sek button{flex:1;min-height:48px;border-radius:12px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--kart)}
.hat-sek .nk{width:10px;height:10px;border-radius:50%}
#bMim{border:2px solid var(--mavi-yazi);color:var(--mavi-yazi)}#bMim .nk{background:var(--mavi-yazi)}
#bMim.aktif{background:var(--mavi);border-color:var(--mavi);color:#fff}
#bMur{border:2px solid var(--mur-kenar);color:var(--mur-yazi)}#bMur .nk{background:var(--mur-kenar)}
#bMur.aktif{background:var(--mur);border-color:var(--mur);color:#fff}
#bMim.aktif .nk,#bMur.aktif .nk{background:#fff}
.mini{display:flex;gap:6px;margin-top:10px}
.mini button{flex:1;min-width:0;min-height:40px;border:1.5px solid var(--cizgi);border-radius:10px;background:var(--kart);color:var(--yazi2);font-size:14px;font-weight:700;padding:0 4px}
.mini button.aktif{background:var(--mavi-zemin);border-color:var(--tab-aktif);color:var(--tab-aktif);font-weight:800}
.karolar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kr{min-height:104px;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:4px}
.kr.ben{border:2px solid var(--mavi);padding:9px 11px}
.kr .kn{font-size:14px;font-weight:700;color:var(--yazi3)}
.kr .kp{font-size:clamp(22px,7.6vw,30px);line-height:1;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kr .kt{min-height:20px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.kr .et{font-size:12px;font-weight:800;padding:2px 8px;border-radius:6px;color:#fff;white-space:nowrap}
.et.sirada{background:var(--yesil)}.et.sen{background:var(--mavi)}.et.ariza{background:var(--kirmizi)}
.et.tur{background:transparent;color:var(--yazi3);border:1px solid var(--cizgi);padding:1px 7px}
.kr.ariza-k{opacity:.7}
.tarih-kutu label{margin:0 0 6px}
#tarih{width:100%;font-size:18px;padding:10px;border-radius:10px}
/* ===== Formlar ===== */
textarea,select,input[type=date],input[type=time],input[type=number],input:not([type]),input[type=text]{font-family:inherit;color:var(--yazi);background:var(--zemin);border:1.5px solid var(--giris-kenar);border-radius:10px}
textarea{width:100%;font-size:20px;padding:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--mavi-yazi);box-shadow:0 0 0 3px var(--halka)}
.arac{display:flex;gap:8px;align-items:center;margin:6px 0}
.arac span{width:auto;min-width:52px;font-weight:800;font-size:20px}
.arac select{flex:1;font-size:18px;padding:10px}
.arac input[type=checkbox]{width:28px;height:28px}
input[type=checkbox]{accent-color:var(--yesil)}
button:disabled,textarea:disabled,select:disabled,input:disabled{opacity:.55}
button.ana{padding:16px;font-family:inherit;font-size:19px;font-weight:800;background:var(--yesil);color:#fff;border:0;border-radius:12px;width:100%;margin:12px 0}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:8px;font-size:16px;background:var(--kart);border-radius:12px;overflow:hidden;border:1px solid var(--cizgi)}
th{background:var(--mavi-zemin);color:var(--tab-aktif);text-align:left;font-weight:800}
th,td{padding:10px 8px;border-bottom:1px solid var(--cizgi2);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#sonuc,#carpi{overflow-x:auto}
@media (max-width:380px){table{font-size:14px}th,td{padding:8px 5px}}
tr.uyari td{background:var(--uyari-zemin)}
tr.bos td{background:var(--bos-zemin)}
/* ===== Açılır bölümler ===== */
details.bolum{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;margin:12px 0 0;padding:0 14px}
details.bolum>summary{font-size:18px;font-weight:800;padding:14px 2px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;min-height:56px}
details.bolum>summary::-webkit-details-marker{display:none}
details.bolum>summary::before{content:'›';display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--mavi-zemin);color:var(--tab-aktif);font-size:24px;font-weight:800;transition:transform .15s}
details.bolum[open]>summary::before{transform:rotate(90deg)}
details.bolum[open]{padding-bottom:12px}
details.bolum details.bolum{border-radius:12px;background:var(--zemin)}
.aks2{display:flex;gap:8px;margin-top:8px}
.aks2 button{flex:1;min-height:48px;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:800}
#bulut{color:var(--yazi3)}
/* eski satır içi renkleri koyu temada uyumlu tut */
[style*="#2c3a4b"],[style*="#edf0f3"]{border-color:var(--cizgi2)!important}
label[style*="#ffcf5a"]{color:var(--turuncu)!important}
b[style*="#9fb0c3"]{color:var(--yazi3)!important}
button[style*="#eaf6f0"]{background:var(--mavi-zemin)!important;color:var(--tab-aktif)!important}
div[style*="color:#0f8a57"]{color:var(--yesil-yazi)!important}
span[style*="#d33b34"]{background:var(--kirmizi)!important}
@media (max-width:359px){.ust h1{font-size:21px}.rozet{font-size:13px;padding:6px 8px}.takip-dugme{font-size:15px}#aksiyon button{font-size:15px}.plaka-sat .pl{width:96px}}
@media print{#alt,#aksiyon{display:none!important}}
</style>
</head>
<body data-sekme="aracim">
<header class="ust">
 <div class="ik"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="14" rx="2.5"/><path d="M4 11h16M8 17v3M16 17v3"/><path d="M8 14h.01M16 14h.01"/></svg></div>
 <div class="ad"><h1>Sefer Sırası</h1><p>Şoför paneli</p></div>
 <span class="rozet">BL-105</span>
</header>
<div id="alan">
<!-- ===== ARACIM ===== -->
<section id="sek_aracim" class="sek" aria-label="Aracım">
 <div class="plaka-sar"><div class="plaka-kart">
  <div class="plaka-sat">
   <div class="pl"><label for="benim">Plakan</label><input id="benim" type="text" inputmode="numeric" autocomplete="off" placeholder="örn. 03"></div>
   <button type="button" id="takipDugme" class="takip-dugme" onclick="takipDugme()"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span id="takipYazi">Takibi başlat</span></button>
  </div>
  <p id="takipDurum" role="status" class="durum"><i aria-hidden="true"></i><span>Takip kapalı</span></p>
 </div></div>
 <div class="sar aracim-ic"><div id="sayac"></div><p class="imza">Seyithan Niksarlı tarafından geliştirildi</p></div>
</section>
<!-- ===== SIRA ===== -->
<section id="sek_sira" class="sek" aria-label="Sıra">
 <div class="sar">
  <div class="hat-sek" role="tablist" aria-label="Hat">
   <button id="bMim" class="aktif" role="tab" onclick="sekme('mim')"><span class="nk"></span>Mimarsinan</button>
   <button id="bMur" role="tab" onclick="sekme('mur')"><span class="nk"></span>Muratçeşme</button>
  </div>
  <div class="mini" id="gunSec">
   <button id="g_hi" onclick="gunSec('hi')">Hafta içi</button>
   <button id="g_cmt" onclick="gunSec('cmt')">Cumartesi</button>
   <button id="g_paz" onclick="gunSec('paz')">Pazar</button>
  </div>
  <div class="mini" id="mevsimSec">
   <button id="m_yaz" onclick="mevsimSec('yaz')">Yaz – 8 nöbetçi</button>
   <button id="m_kis" onclick="mevsimSec('kis')">Kış – 7 nöbetçi</button>
  </div>
  <section aria-label="Araç sırası" style="margin-top:18px">
   <div class="bas"><h2 id="siraBaslik">Mimarsinan sırası</h2><span id="siraSay"></span></div>
   <div id="plakaKaro" class="karolar"></div>
   <p class="kucuk" id="siraNot" style="margin:10px 2px 0">Sırayı kahya belirler.</p>
  </section>
  <div class="kutu tarih-kutu" style="margin-top:16px"><label for="tarih">Tarih</label><input type="date" id="tarih" onchange="tarihSec(this.value)"></div>
 </div>
</section>
<!-- ===== SEFERLER ===== -->
<section id="sek_seferler" class="sek" aria-label="Seferler"><div class="sar"><div id="alanSeferler"></div></div></section>
<!-- ===== DAHA FAZLA ===== -->
<section id="sek_daha" class="sek" aria-label="Daha fazla"><div class="sar">
 <div id="alanDaha"></div>
 <details class="bolum" data-k="veri"><summary>Veriler</summary><p class="kucuk">Bu cihazdaki günlük kayıtları kopyala ya da başka cihazdan yapıştır.</p><div class="aks2"><button style="background:var(--mavi)" onclick="veriKopyala()">Verileri kopyala</button><button style="background:var(--yesil)" onclick="veriYapistir()">Verileri yapıştır</button></div></details>
 <div id="bulut" class="kucuk" style="text-align:center;margin:14px 0 0"></div>
 <p class="imza">Seyithan Niksarlı tarafından geliştirildi · BL-105</p>
</div></section>
</div>

// Saat düzeltmesi: gerçek zaman = Date.now()+SAAT_OFF (İETT Worker /?saat=1 ile ölçülür)
var SAAT_OFF=0,SAAT_Z=0,SAAT_RTT=0;
function simdiD(){return new Date(Date.now()+SAAT_OFF)}
async function saatSenk(){try{if(typeof IETT_URL!=='string'||!IETT_URL)return;let b=null;for(let i=0;i<3;i++){if(i)await new Promise(r=>setTimeout(r,300));try{const t0=Date.now(),r=await fetch(IETT_URL+'/?saat=1&_='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(5000)}),j=await r.json(),t1=Date.now();if(!j||typeof j.t!=='number')continue;const rtt=t1-t0;if(!b||rtt<b.rtt)b={rtt,off:j.t-(t0+t1)/2}}catch(e){}}if(!b||b.rtt>2500)return;SAAT_OFF=Math.round(b.off);SAAT_Z=Date.now();SAAT_RTT=b.rtt}catch(e){}}
function saatYazi(){const st='<p class="kucuk saat-not">';if(typeof IETT_URL!=='string'||!IETT_URL)return st+'Saat düzeltmesi kapalı (İETT adresi girilmemiş)</p>';if(!SAAT_Z)return '';const d=SAAT_OFF/1000;return st+'Saat düzeltmesi: '+(d<0?'-':'+')+Math.abs(d).toFixed(1).replace('.',',')+' sn (ağ gecikmesi '+SAAT_RTT+' ms)</p>'}
try{setTimeout(saatSenk,2000);setInterval(saatSenk,300000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-SAAT_Z>60000)saatSenk()})}catch(e){}

<script>

const stdUz=()=>(simdi=='mim'?gun:gunOf('mim'))=='hi'&&!(durum.mim&&durum.mim.uzatYok);
const mimTur=s=>(stdUz()&&((s>=t(7,24)&&s<t(8,30))||(s>=t(15,0)&&s<t(19,0))))?71*60:65*60;
const MIM={ad:'Mimarsinan',son:t(23,0),tur:s=>mimTur(s)+uzEk(s,99,'mim')*60,turler:['nobetci','dokuzcu','takviye'],sinir:{nobetci:t(23,0),dokuzcu:t(20,45),takviye:t(19,30)}};
const MUR={ad:'Muratçeşme',son:t(22,0),tur:s=>45*60+uzEk(s,99,'mur')*60,turler:['nobetci','takviye'],sinir:{nobetci:t(22,0),takviye:t(19,30)}};

function sabahOv(d,o){const L=((d||{}).sabah||[]).map(x=>String(x).trim().split(':').map(Number)).filter(q=>q.length>=2&&q.every(n=>!isNaN(n))).sort((x,y)=>t(...x)-t(...y));if(L.length)o.sabah=L;return o}
function ayar(){return sabahOv(durum[simdi],Object.assign({},simdi=='mim'?MIM:MUR,GUN[gun][simdi],{gb:(durum[simdi]||{}).bant}))}
function bantKat(taban,gb){
 const sv=x=>{const q=String(x||'').split(':');return q.length<2?NaN:t(+q[0],+q[1])};
 const G=(gb||[]).map(b=>[sv(b.b),sv(b.s),(+b.a)*60]).filter(b=>!isNaN(b[0])&&!isNaN(b[1])&&b[1]>b[0]&&b[2]>0);
 let L=taban.map(b=>b.slice());
 for(const g of G){const Y=[];for(const b of L){if(b[1]<=g[0]||b[0]>=g[1]){Y.push(b);continue}if(b[0]<g[0])Y.push([b[0],g[0],b[2]]);if(b[1]>g[1])Y.push([g[1],b[1],b[2]])}L=Y}
 return L.concat(G).sort((x,y)=>x[0]-y[0]);
}
function seferler(a){
 const o=a.sabah.map(x=>t(...x));let c=o[o.length-1];
 for(const b of bantKat(a.bant,a.gb)){if(c<b[0]-b[2]){c=b[0];o.push(c)}for(;;){const n=c+b[2];if(n>b[1]+0.5)break;o.push(n);c=n}}
 return [...new Set(o.map(x=>Math.round(x)))].sort((x,y)=>x-y).filter(x=>x<=a.son);
}

 if(document.querySelector('[data-sb]')){const L=[...document.querySelectorAll('[data-sb]')].map(x=>x.value.trim().replace('.',':')).filter(x=>/^\d{1,2}:\d{2}(:\d{2})?$/.test(x)).map(x=>t(...x.split(':').map(Number))).sort((x,y)=>x-y).map(fmt);d.sabah=L.join()==GUN[gun][simdi].sabah.map(x=>fmt(t(...x))).join()?[]:L}
 if(document.querySelector('[data-bi]')){d.bant=[];document.querySelectorAll('[data-bi]').forEach(r=>{const g=k=>r.querySelector('[data-b="'+k+'"]').value;if(g('b')&&g('s')&&+g('a')>0)d.bant.push({b:g('b'),s:g('s'),a:+g('a')})})}
 if(e)d.plakalar=e.value;

 document.querySelectorAll('[data-ariza]').forEach(x=>{d.ariza[x.dataset.ariza]=x.checked});
 if(!d.ortak)d.ortak={};document.querySelectorAll('[data-ortak]').forEach(x=>{d.ortak[x.dataset.ortak]=x.checked});
 {const c=document.getElementById('uzYok');if(c)durum.mim.uzatYok=c.checked}
 if(document.querySelector('[data-uzi]')){d.uzat=[];document.querySelectorAll('[data-uzi]').forEach(r=>{const g=x=>r.querySelector('[data-u="'+x+'"]').value;const e=[...r.querySelectorAll('[data-ue]')].map(x=>+x.value||0);if(g('b')&&g('s')&&e.some(x=>x))d.uzat.push({b:g('b'),s:g('s'),e:e})})}
 {const ar=document.getElementById('araclar');if(ar&&ar.dataset.hat==simdi){d.yokEk={};document.querySelectorAll('[data-yer]').forEach(r=>{const p=r.dataset.yer;(d.yokEk[p]=d.yokEk[p]||[]).push({b:r.querySelector('[data-yeb]').value,s:r.querySelector('[data-yes]').value})})}}
 if(!d.yok)d.yok={};document.querySelectorAll('[data-yokb]').forEach(x=>{const p=x.dataset.yokb;d.yok[p]=d.yok[p]||{};d.yok[p].b=x.value});document.querySelectorAll('[data-yoks]').forEach(x=>{const p=x.dataset.yoks;d.yok[p]=d.yok[p]||{};d.yok[p].s=x.value});
}
function plakaListesi(){return durum[simdi].plakalar.split(/[\s,;]+/).filter(x=>x)}

}
function turDegisti(el){

}

 }

}
function hesapla(){
 oku();
 const a=ayar(),d=durum[simdi];
 const sonuc=document.getElementById('sonuc');
 const canli=plakaListesi().filter(p=>!d.ariza[p]).map(p=>({p:p,k:a.turler.includes(d.tur[p])?d.tur[p]:'nobetci'}));
 if(canli.length==0){sonuc.innerHTML='<p>Plaka gir.</p>';return}
 const sf=seferler(a);
 const sonCikis={},say={};PLAN={};
 let idx=0,satirlar='';
 const YK={};const ykE=(p,y)=>{if(y&&y.b&&y.s){const q=y.b.split(':'),r=y.s.split(':');(YK[p]=YK[p]||[]).push([t(+q[0],+q[1]),t(+r[0],+r[1])])}};for(const c of canli){ykE(c.p,d.yok&&d.yok[c.p]);((d.yokEk&&d.yokEk[c.p])||[]).forEach(y=>ykE(c.p,y))}
 const yokMu=(p,s)=>!!YK[p]&&YK[p].some(x=>s>=x[0]&&s<x[1]);
 const BK={};const bekle=c=>{BK[c.p]={c:c,n:0}};
 const YPEN=simdi=='mur'?1:5;const yokSec=s=>{let r=null;for(const p in BK){const b=BK[p];if(!r&&!yokMu(p,s)&&b.n<=YPEN&&s<=a.sinir[b.c.k]){r=b.c;delete BK[p];continue}b.n++;if(b.n>YPEN)delete BK[p]}return r};
 sf.forEach(s=>{
  let secilen=yokSec(s);if(!secilen)
  for(let j=0;j<canli.length;j++){
   const c=canli[(idx+j)%canli.length];
   if(s<=a.sinir[c.k]){if(yokMu(c.p,s)){bekle(c);continue}secilen=c;idx=(idx+j+1)%canli.length;break}
  }
  if(!secilen){satirlar+='<tr class="bos"><td>'+fmt(s)+'</td><td>Araç yok</td><td></td><td></td></tr>';return}
  const p=secilen.p;
  say[p]=(say[p]||0)+1;
  let uyari='';
  if(sonCikis[p]!==undefined){
   const donus=sonCikis[p]+a.tur(sonCikis[p]);
   if(donus>s)uyari='Hızlanmalı, '+Math.ceil((donus-s)/60)+' dk geç';
  }
  sonCikis[p]=s;(PLAN[p]=PLAN[p]||[]).push(s);
  satirlar+='<tr'+(uyari?' class="uyari"':'')+'><td>'+fmt(s)+'</td><td>'+p+'</td><td>'+say[p]+'</td><td>'+uyari+'</td></tr>';
 });

 for(const c of canli){ozet+='<tr><td>'+c.p+'</td><td>'+ADLAR[c.k]+'</td><td>'+(sonCikis[c.p]!==undefined?fmt(sonCikis[c.p]):'-')+'</td><td>'+(say[c.p]||0)+'</td></tr>'}
 ozet+='</table>';
 sonuc.innerHTML=ozet+'<h3>Tüm seferler</h3><table><tr><th>Saat</th><th>Araç</th><th>Servis</th><th>Uyarı</th></tr>'+satirlar+'</table>';{let g=0;const gd=[];for(const q in PLAN){g+=PLAN[q].length;for(const x of PLAN[q])gd.push(x)}GSL[simdi]=g;GSD[simdi]=gd.sort((p,q)=>p-q);GUNSEFER=(GSL.mim||0)+(GSL.mur||0)}planYayinla();
}

function yeniFormat(x){
 if(!/B\s*Ç\s*G\s*D/.test(x))return x;
 const AD='(Fatih|Do[ğg]an\\s*G[ıi]da|Do[ğg]an\\s*G|Macro2|Macro|TaksiDura[ğg][ıi]2|TaksiDura[ğg][ıi]|TaksiDu\\S*|Moro[ğg]lu|Bal[ıi]k[çc][ıi]|Metrob[üu]s?|T[üu]yap2|Atirus2|Eczane2|Atrium)';

// iett.js – İETT 448 canlı otobüs satırı (sofor.js'den sonra yüklenir)
var IETT_URL=localStorage.getItem('iettUrl')||'',IETT={z:0,v:null,yuk:false,dene:0,hata:'',stale:false,pas:{},tab:{},gon:{}},IETT_HIZ=22,IETT_YAR=150;
function iettKaydet(){const v=document.getElementById('iettUrl').value.trim().replace(/\/+$/,'');IETT_URL=v;localStorage.setItem('iettUrl',v);if(FB)FB.collection('ayar').doc('iett').set({u:v,z:Date.now()}).then(()=>alert('Adres kaydedildi, bütün cihazlar kullanacak')).catch(e=>alert('Kaydedilemedi: '+e.code));else alert('Bu cihaza kaydedildi')}
function ietEnrich(){try{if(!IETT_URL||IETT.yuk)return;const n=Date.now();if(n-IETT.dene<60000)return;IETT.yuk=true;IETT.dene=n;fetch(IETT_URL+'/?hat=448',{signal:AbortSignal.timeout(15000)}).then(r=>r.json()).then(j=>{if(j&&j.ok&&Array.isArray(j.araclar)){IETT.v=j.araclar;IETT.z=j.z>1e12?j.z:Date.now();IETT.stale=j.stale===true;IETT.hata='';try{ietGecis(j.araclar,Date.now())}catch(e){}}else IETT.hata='Yanıt yok';IETT.yuk=false}).catch(()=>{IETT.hata='İnternet yok';IETT.yuk=false})}catch(e){IETT.yuk=false}}
function ietYakin(v,d,bati,now){const o=[];(v||[]).forEach(b=>{const la=parseFloat(b.enlem),ln=parseFloat(b.boylam);if(isNaN(la)||isNaN(ln))return;const y=String(b.yon).toLocaleUpperCase('tr');if(!y.includes(bati?'GÜZELCE':'HARAM'))return;if(bati?ln<d[1]-0.0003:ln>d[1]+0.0003)return;const t=new Date(String(b.son_konum_zamani).replace(' ','T')).getTime();if(!isNaN(t)&&now-t>300000)return;const km=mesafe([la,ln],d)/1000;o.push({k:b.kapino,km:km,la:la,ln:ln,dk:Math.max(1,Math.round(km*1.3/IETT_HIZ*60))})});return o.sort((a,b)=>a.km-b.km).slice(0,2)}
// yolcu uygulamasındaki mim hattı durakları (yolcu.html HAT.mim, sıra korunur) ve KK eşlemesi
const YOLCU={g:["Fatih Market","Güzelce Yol Ağzı","Billur Caddesi","Çarmıklı Caddesi","Atrium Çarşı","Anaokulu (Doğan Gıda)","Villalar","Sahil Tepe Villaları","Sinanoba","Makro Çarşı","Mimar Sinan Konakları","Mimaroba Muhtarlık","Oba","Dr. Sadık Ahmet İlkokulu","Mustafa Kemal Paşa Bulvarı (Meydan)","Denizgören","Piri Reis Caddesi","Siteler (Moroğlu)","İnönü Caddesi","Güzelsu","Doç. Dr. Burhan Bahriyeli Lisesi","Mimar Sinan Belediye (Balıkçı)","Eczane","Büyükçekmece Atirus","Büyükçekmece İŞKUR","Fatih Mahallesi","Tabya 1","Tabya 2","Metrobüs"],d:["TÜYAP","Doğa Koleji","Çekmece","Eczane","Mimar Sinan Karayolları","Mimar Sinan Camii","Balıkçılar (Mimar Sinan)","Doç. Dr. Burhan Bahriyeli Lisesi","Güzelsu","İnönü Caddesi","Siteler (Moroğlu)","Piri Reis Caddesi","Denizgören","Mustafa Kemal Paşa Bulvarı (Meydan)","Dr. Sadık Ahmet İlkokulu","Oba","Mimaroba Muhtarlık","Mimar Sinan Konakları","Makro Çarşı","Sinanoba","Sahil Tepe Villaları","Villalar","Anaokulu (Doğan Gıda)","Atrium Çarşı","Çarmıklı Caddesi","Billur Caddesi","Güzelce Yol Ağzı"]},KK={"Fatih Market":"Fatih Market","Atrium Çarşı":"Atrium","Anaokulu (Doğan Gıda)":"Doğan Gıda","Makro Çarşı":"Makro Çarşı","Mustafa Kemal Paşa Bulvarı (Meydan)":"Meydan","Denizgören":"Denizgören","Siteler (Moroğlu)":"Moroğlu","Mimar Sinan Belediye (Balıkçı)":"Balıkçı","Metrobüs":"Metrobüs","TÜYAP":"TÜYAP","Çekmece":"Çekmece","Balıkçılar (Mimar Sinan)":"Mimar Sinan","Muratçeşme":"Muratçeşme","Göbek (Pınar Sokak)":"Göbek","Mimar Sinan Kiptaş":"Kiptaş","Akbelde":"Akbelde","Mimar Sinan Devlet Hastanesi":"Hastane"},kk=n=>KK[n]||n;
// ---- öğrenen süre: geçiş algılama, Firestore 'iettSure', medyan tablo ----
function ietGun(ms){const d=new Date(ms).getDay();return d===0?'paz':d===6?'cmt':'hi'}
function ietZ(b){return new Date(String(b.son_konum_zamani).replace(' ','T')).getTime()}
function ietSira(bati){const a=[];for(const n in KONUM){const p=KONUM[n];if(p&&p.length>1&&!isNaN(p[0])&&!isNaN(p[1]))a.push(n)}a.sort((x,y)=>KONUM[x][1]-KONUM[y][1]);return bati?a.reverse():a}
function ietId(a,b,bati){return (a+'__'+b+'_'+(bati?'b':'d')).replace(/\//g,'-')}
function ietMed(a){a=a.slice().sort((x,y)=>x-y);const n=a.length;return n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2}
function ietSeg(id,now){const o=IETT.tab[id];if(!o||!o.length)return null;const g=ietGun(now);let L=o.filter(x=>x.g===g&&x.s>0);if(L.length<3)L=o.filter(x=>x.s>0);return L.length<3?null:ietMed(L.map(x=>x.s))}
function ietYaz(id,s){try{if(!FB)return;const kk=id+'|'+s.k+'|'+s.z;if(IETT.gon[kk])return;IETT.gon[kk]=1;const o=IETT.tab[id];if(o&&o.some(x=>x.k===s.k&&x.z===s.z))return;const r=FB.collection('iettSure').doc(id);FB.runTransaction(tx=>tx.get(r).then(d=>{let a=(d.exists&&d.data().o)||[];if(a.some(x=>x.k===s.k&&x.z===s.z))return;a=a.concat([s]).sort((x,y)=>x.z-y.z).slice(-30);tx.set(r,{o:a})})).catch(()=>{})}catch(e){}}
function ietPar(k,n,e,bati){const S=ietSira(bati),i=S.indexOf(n);if(i<1)return;const q=IETT.pas[k][S[i-1]];if(!q||!q.f||q.y!==bati)return;const f=e.z-q.z,s=Math.round(f/1000);if(f<=0||f>1200000||s<20||s>900)return;e.s=1;ietYaz(ietId(S[i-1],n,bati),{s:s,k:k,z:e.z,g:ietGun(e.z)})}
function ietGecis(v,now){const P=IETT.pas;(v||[]).forEach(b=>{const la=parseFloat(b.enlem),ln=parseFloat(b.boylam),t=ietZ(b),k=b.kapino;if(isNaN(la)||isNaN(ln)||isNaN(t)||!k)return;const y=String(b.yon).toLocaleUpperCase('tr'),bati=y.includes('GÜZELCE');if(!bati&&!y.includes('HARAM'))return;const pk=P[k]||(P[k]={});
 for(const n in KONUM){const p=KONUM[n];if(!p||isNaN(p[0]))continue;const m=mesafe([la,ln],p),e=pk[n];
  if(m<=IETT_YAR){if(!e||e.y!==bati||t-e.z>600000)pk[n]={z:t,m:m,y:bati,f:0,s:0};else if(!e.s&&m<e.m){e.z=t;e.m=m;e.f=0}}
  else if(e&&!e.f&&t>e.z){e.f=1;ietPar(k,n,e,bati)}}
 for(const n in pk)if(now-pk[n].z>1800000)delete pk[n]})}
function ietEta(b,hd,bati,now){const S=ietSira(bati),ti=S.indexOf(hd),yedek=Math.max(1,Math.round(b.km*1.3/IETT_HIZ*60));if(ti<0)return yedek;
 const ni=S.findIndex(n=>bati?KONUM[n][1]<=b.ln:KONUM[n][1]>=b.ln);if(ni<1||ni>ti)return yedek;
 const A=KONUM[S[ni-1]][1],B=KONUM[S[ni]][1];let r=B===A?0:(b.ln-A)/(B-A);r=Math.min(1,Math.max(0,r));let sn=0,bil=0;
 for(let j=ni;j<=ti;j++){const a=S[j-1],c=S[j];let m=ietSeg(ietId(a,c,bati),now);if(m===null)m=mesafe(KONUM[a],KONUM[c])/1000*1.3/IETT_HIZ*3600;else bil=1;sn+=(j===ni?1-r:1)*m}
 return bil?Math.max(1,Math.round(sn/60)):yedek}
function ietHat(){const b=(typeof TB!=='undefined'&&TB)||(typeof simdi!=='undefined'?simdi:null);return b}
function ietOnde(bati){const L=[];(bati?YOLCU.d:YOLCU.g).forEach(a=>{const p=KONUM[kk(a)];if(p&&p.length>1&&!isNaN(p[0])&&!isNaN(p[1]))L.push([a,p])});if(!L.length||typeof BENKONUM==='undefined'||!BENKONUM)return [];let n=0,m=1e12;L.forEach((x,j)=>{const d=mesafe(BENKONUM,x[1]);if(d<m){m=d;n=j}});if(n+1<L.length&&mesafe(BENKONUM,L[n+1][1])<mesafe(L[n][1],L[n+1][1]))n++;return L.slice(n,n+2).map(x=>x[0])}
function ietDur(D,i,e,now,st){let h='';if(!(e>=-120)||ietHat()!=='mim')return h;let bati=false;if(e>=0&&i>=0){const M=D.findIndex(x=>x[0]==='Metrobüs');bati=M>=0&&i>M}
 ietOnde(bati).forEach(a=>{const k=kk(a),L=ietYakin(IETT.v,KONUM[k],bati,now);L.forEach(x=>{x.dk=ietEta(x,k,bati,now)});const x=L[0];h+='<div class="sat sat-448">'+SVG_OTOBUS+'<span class="sat-ad">'+a+' → 448</span><b>'+(x?x.k+' ~'+x.dk+' dk':'yaklaşan yok')+'</b></div>'});return h}
function ietSatir(D,i,e){
 if(!IETT_URL||ietHat()!=='mim')return '';if(!(e>=-120))return '';ietEnrich();
 const st='';
 if(!IETT.v)return IETT.hata?'<p class="kucuk" style="'+st+'">İETT alınamadı</p>':'';
 const now=Date.now();let h='';try{h=ietDur(D,i,e,now,st)}catch(x){h=''}
